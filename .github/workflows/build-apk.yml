name: Compilar RoletaVision APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Build da aplicação web
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar o SDK do Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Dar permissão ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: cd android && ./gradlew assembleDebug

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoletaVision-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
