name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar RoletaVision APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Build da aplicacao web
        run: npm run build

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar o SDK do Android
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Dar permissao ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload do APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RoletaVision-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
